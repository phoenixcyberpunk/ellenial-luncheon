name: Read today's menus

# Runs every half hour on weekday mornings, so menus are fresh all through work hours
# (times are UTC; Stockholm is UTC+1 in winter, UTC+2 in summer):
# 05:07–10:37 UTC = 06:07–11:37 Stockholm in winter, 07:07–12:37 in summer.
# Many runs on purpose: some places post late, a site can be down for a moment, and
# GitHub sometimes starts scheduled runs late or skips one. A run with nothing new
# changes nothing (no commit, no deploy). Minutes 7 and 37 avoid GitHub's busy :00.
on:
  schedule:
    - cron: '7,37 5-10 * * 1-5'
  workflow_dispatch:
    inputs:
      watchdog_test:
        description: 'Send a test alert (opens and closes one issue) instead of the normal check'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'places.json'

permissions:
  contents: write
  issues: write   # the watchdog opens/closes "Lunch alert" issues, which GitHub emails to Ellen

concurrency:
  group: read-menus
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read menus
        run: node scripts/read-menus.mjs
      - name: Watchdog (email via a GitHub issue when a site seems to have changed)
        continue-on-error: true   # alerts must never stop menus from being saved
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCHDOG_TEST: ${{ inputs.watchdog_test && '1' || '' }}
        run: |
          git show HEAD:data/menus.json > "$RUNNER_TEMP/prev-menus.json" 2>/dev/null || echo '{"places":[]}' > "$RUNNER_TEMP/prev-menus.json"
          node scripts/watchdog.mjs "$RUNNER_TEMP/prev-menus.json"
      - name: Save menus if they changed
        run: |
          if [ -z "$(git status --porcelain -- data/menus.json data/menu-images)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "luncheon-bot"
          git config user.email "luncheon-bot@users.noreply.github.com"
          git add data/menus.json data/menu-images
          git commit -m "Menus for $(TZ=Europe/Stockholm date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
