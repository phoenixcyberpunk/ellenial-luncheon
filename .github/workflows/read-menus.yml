name: Read today's menus

# Runs on weekday mornings (times are UTC; Stockholm is UTC+1 in winter, UTC+2 in summer).
# Several runs, because some places post their menu late in the morning.
on:
  schedule:
    - cron: '20 6 * * 1-5'
    - cron: '20 8 * * 1-5'
    - cron: '50 9 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'places.json'

permissions:
  contents: write

concurrency:
  group: read-menus
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read menus
        run: node scripts/read-menus.mjs
      - name: Save menus if they changed
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "luncheon-bot"
          git config user.email "luncheon-bot@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Menus for $(TZ=Europe/Stockholm date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
